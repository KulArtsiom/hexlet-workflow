apiVersion: 1

providers:
  - name: devops-example
    orgId: 1
    folder: "DevOps Example"
    folderUid: devops-example
    type: file
    disableDeletion: true
    # "Cannot save provisioned dashboard" в UI — это не баг, а фича:
    # дашборд редактируется в git, а не мышкой.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false