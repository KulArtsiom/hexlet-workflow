name: release

# Триггер: пуш git-тега, начинающегося с v (v1, v2, v1.5...).
# Обычные пуши веток этот воркфлоу не трогают.
on:
  push:
    tags:
      - 'v*'

env:
  APP_IMAGE: koolinio/devops-lab-app
  CADDY_IMAGE: koolinio/devops-lab-caddy

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # checkout не нужен: мы не собираем код,
      # а только переклеиваем теги на готовых образах.

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # github.ref_name для тега v3 равен "v3" —
      # это и есть номер релиза.

      # Забираем текущие latest — те самые, что прошли
      # тесты в основном CI.
      - run: docker pull ${{ env.APP_IMAGE }}:latest
      - run: docker pull ${{ env.CADDY_IMAGE }}:latest

      # docker tag ничего не копирует — просто добавляет
      # образу второе имя. Дёшево и мгновенно.
      - run: docker tag ${{ env.APP_IMAGE }}:latest ${{ env.APP_IMAGE }}:${{ github.ref_name }}
      - run: docker tag ${{ env.CADDY_IMAGE }}:latest ${{ env.CADDY_IMAGE }}:${{ github.ref_name }}

      # Публикуем версионные теги. Слои уже в реестре,
      # зальются только метаданные — секунды.
      - run: docker push ${{ env.APP_IMAGE }}:${{ github.ref_name }}
      - run: docker push ${{ env.CADDY_IMAGE }}:${{ github.ref_name }}