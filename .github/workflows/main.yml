name: main

on: 
  - push

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: make setup
      - run: make lint
      - run: make test
      - uses: hexlet-components/hello-from-hexlet-action@release