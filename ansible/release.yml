# Плей 1: приложение — на ВСЕ серверы группы webservers.
- name: Deploy app
  hosts: webservers
  become: true       # docker через sudo: не зависим от групп и таймингов
  tasks:
    - name: Create shared network
      community.docker.docker_network:
        name: devops-example

    - name: Run app container
      community.docker.docker_container:
        name: app
        image: "koolinio/devops-lab-app:{{ version }}"
        pull: true
        restart_policy: always
        state: started
        networks:
          - name: devops-example
        # Подстановка host-переменных из инвентаря:
        # на web1 и web2 получатся разные значения.
        env:
          SERVER_MESSAGE: "{{ server_message }}"
        published_ports: "{{ app_ports }}"

# Плей 2: балансировщик — только на группу balancers (web1).
- name: Deploy balancer
  hosts: balancers
  become: true
  tasks:
    - name: Run caddy container
      community.docker.docker_container:
        name: caddy
        image: "koolinio/devops-lab-caddy:{{ version }}"
        pull: true
        restart_policy: always
        state: started
        networks:
          - name: devops-example
        published_ports:
          - 80:80
          - 443:443